# Golden set — answerable slice (target: 35)
#
# Questions the system SHOULD answer, each labeled with the article(s) that
# support the answer. Measures retrieval recall@5 and MRR, plus the LLM-judge
# answer grade. These also serve as the over-refusal denominator: a refusal here
# is a failure.
#
# Format and status lifecycle: see README.md in this directory.
#
# SOURCE WARNING: every case below came from one website (manielaw-sa.com), from
# three comment threads. People commenting under an article about Article 75 ask
# about Article 75, so this distribution reflects those pages, not what Saudis
# generally worry about. The remaining slots should come from other sources.

cases:
  # --- wage definition: which allowances count toward the EOSB base -----------
  - id: GS-A-001
    slice: answerable
    language: ar
    status: drafted
    topic: wage_definition
    question: |-
      السلام عليكم ارغب بمعرفه مكافئة نهاية الخدمة الراتب الأساسي ٦٥٠٠ بدل المواصلات ١٦٢٥ بدل السكن ٥٤١ بدل متغير سوق العمل ٢٠٠٠ هل البدل المتغير يدخل من ضمن احتساب نهاية الخدمه وشكرا
    provenance:
      source: public_forum
      url: https://manielaw-sa.com/المادة-75-من-نظام-العمل/
      retrieved: 2026-08-19
      note: "comment dated 26 March 2025"
    notes: >
      Gives a full wage breakdown but asks which components count, not for a
      total. Arabic-Indic digits throughout — exercises the normalizer.

  - id: GS-A-002
    slice: answerable
    language: ar
    status: drafted
    topic: wage_definition
    question: |-
      خدمتي 9 سنوات هل استحق مكافءة نهاية الخدمة كاملة علما ان العقد غير محدد المدة وكيف يتم احتساب مكافءة نهاية الخدمة اذا كان الراتب الاجمالي 4200 وبعد خصم التامينات 3930 هل يتم احتساب المكفاءة قبل خصم التامينات او بعد خصم التامينات
    provenance:
      source: public_forum
      url: https://manielaw-sa.com/المادة-75-من-نظام-العمل/
      retrieved: 2026-08-19
      note: "comment dated 20 May 2025"
    notes: >
      Mentions GOSI but is NOT a GOSI question — it asks what the wage base is,
      which the Labor Law defines. Must be answered, not refused. Good test of
      the refusal classifier over-triggering on the word التأمينات.

  # --- EOSB entitlement ------------------------------------------------------
  - id: GS-A-003
    slice: answerable
    language: ar
    status: drafted
    topic: eosb
    question: |-
      السلام عليكم ورحمة الله وبركاته،،،، شكراً لكم على شرح المادة وتثقيف المتابعين السؤال كالتالي/ كيف يتم حساب مكافأة نهاية الخدمة اذا كان عقدي غير محدد المدة (مدة الخدمة 7 سنوات) وقد اشعرت صاحب العمل قبل 30 يوماً؟ هل تكون نهاية الخدمة نصف راتب للخمس سنوات الاولى وراتب لباقي السنوات او يتم الاحتساب وفق ثلثين المكافأة، وجزيتم خير الجزاء
    provenance:
      source: public_forum
      url: https://manielaw-sa.com/المادة-75-من-نظام-العمل/
      retrieved: 2026-08-19
      note: "comment dated 21 April 2025"
    notes: "Asks which formula applies and offers two candidates. No wage given, but no number is wanted."

  - id: GS-A-004
