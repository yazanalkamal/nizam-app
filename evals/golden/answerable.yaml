      خدمتي كانت سنة وستة أشهر، وقد أنهيت عقدي وفق المادة (75) من نظام العمل لأسباب شخصية، مع الالتزام الكامل بفترة الإشعار النظامية. إلا أن الشركة أفادت بعدم استحقاقي لمكافأة نهاية الخدمة بحجة أن مدة خدمتي أقل من سنتين، وذلك استنادًا إلى المادة (85) من نظام العمل هل استحق مكافأة ام لا ؟
