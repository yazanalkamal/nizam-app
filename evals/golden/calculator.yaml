# Golden set — calculator slice (target: 15)
#
# End-of-service benefit questions with exact expected numbers. Scored by exact
# match; no LLM judge is involved in this slice.
#
# Must include the adversarial cases, not just the happy path:
#   - resignation under 2 years of service
#   - fractional years
#   - wage changes shortly before termination (out of scope — the system must
#     say so rather than guessing)
#
# Monetary values are QUOTED STRINGS. A bare YAML decimal parses as a float and
# will not survive exact-match comparison; the validator rejects floats.
#
# Format and status lifecycle: see README.md in this directory.
#
# ---------------------------------------------------------------------------
# EXAMPLES — uncomment and edit. Delete the `cases: []` line below when you do.
#
# The expected amount and article numbers in the second example are
# PLACEHOLDERS to show the shape. No number here is a real calculation. Every
# one must be derived from the ingested current text before use.
# ---------------------------------------------------------------------------
#
# cases:
#   # As you write it today. Inputs are facts about a hypothetical person, so
#   # you can fill them in now. The expected amount cannot be — it depends on
#   # the law text, which isn't ingested yet. Hence status: drafted.
#   - id: GS-C-001
#     slice: calculator
