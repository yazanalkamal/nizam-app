# Golden set — calculator slice (target: 15)
#
# End-of-service benefit questions. Three expected outcomes:
#   expects: amount         — enough information; scored by exact match, no judge
#   expects: clarification  — something is missing; the system must ask for it
#   expects: out_of_scope   — e.g. wage change near termination; must say so
#
# Monetary values are QUOTED STRINGS. A bare YAML decimal parses as a float and
# will not survive exact-match comparison; the validator rejects floats.
#
# Format and status lifecycle: see README.md in this directory.
#
# WHAT THE FIRST RESEARCH PASS FOUND: of ~40 real questions collected, NOT ONE
# supplied a wage, a start date, an end date and a termination type together.
# People write "خدمتي 7 سنوات" and never mention their salary. So every case
# below is a clarification case, and the `expects: amount` cases still have to be
# authored by hand with complete inputs.

cases:
  - id: GS-C-001
    slice: calculator
    language: ar
    status: drafted
    topic: eosb
    expects: clarification
    question: |-
      تذا كانت خدمتي في الشركة 6 سنوات و 8 اشهر و 20 يوما وتم انهاء عقدي وفقا للمادة 75 من نظام العمل فكم تكون نهاية خدمتي
    inputs:
      stated_duration: "6 سنوات و 8 اشهر و 20 يوما"
      termination_type: employer_termination
    missing_parameters: [monthly_wage]
    provenance:
      source: public_forum
      url: https://manielaw-sa.com/المادة-75-من-نظام-العمل/
      retrieved: 2026-08-19
      note: "comment dated 13 November 2025"
    notes: >
      Asks for a figure ("فكم تكون") with no salary anywhere in the question. The
      dangerous failure is a model inventing a wage and answering confidently.
      Note the typo "تذا" for "إذا" — left exactly as written.

  - id: GS-C-002
    slice: calculator
    language: ar
    status: drafted
    topic: eosb
    expects: clarification
    question: |-
      خدمتي سنتين و8 شهور في الشركة وقبل يومين بلغوني أنهم راح ينهو نشاط الشركة فماهي مكافأة نهاية الخدمة وهل أستحق تعويض عن فترة الاشعار مع العلم أن عقدي غير محدد المدة
    inputs:
      stated_duration: "سنتين و8 شهور"
      termination_type: employer_termination
    missing_parameters: [monthly_wage]
    provenance:
      source: public_forum
      url: https://manielaw-sa.com/المادة-75-من-نظام-العمل/
      retrieved: 2026-08-19
      note: "comment dated 30 June 2025"
    notes: >
      Two asks in one: a figure (needs the wage) and an entitlement question about
      notice compensation (answerable without it). The system should answer the
      second while asking for the first, not refuse both.

  - id: GS-C-003
    slice: calculator
    language: ar
    status: drafted
    topic: eosb
    expects: clarification
    question: |-
      خدمتي 9 سنوات و11 شهر ، بعد كم يوم النشاط سيغلق ، لكن لم يتم تبليغنا كتابياً بالإنهاء ، هل يحق لي مطالبتهم بمبلغ شهرين الاشعار ومكافئة ال10 سنوات؟! وهل ستكون مستحقاتي على اساس راتب كامل عن كل سنه ؟
    inputs:
      stated_duration: "9 سنوات و11 شهر"
      termination_type: employer_termination
    missing_parameters: [monthly_wage]
    provenance:
      source: public_forum
      url: https://manielaw-sa.com/المادة-75-من-نظام-العمل/
      retrieved: 2026-08-19
      note: "comment dated 26 June 2025"
    notes: >
      User rounds 9y11m to "10 years" themselves. The system must not adopt the
      user's rounding — whether the boundary matters is a legal question, not an
      arithmetic convenience.
