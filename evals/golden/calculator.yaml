#     status: drafted
#     question: "راتبي ١٢٠٠٠ وخدمتي من مارس ٢٠٢٠ إلى يونيو ٢٠٢٤ واستقلت، كم مكافأة نهاية الخدمة؟"
#     inputs:
#       monthly_wage: "12000.00"        # quoted — see the money rule above
#       start_date: 2020-03-01
#       end_date: 2024-06-30
#       termination_type: resignation
#     provenance:
#       source: author
#     notes: >
#       Question uses Arabic-Indic digits on purpose — the normalizer has to
#       fold ٠-٩ to ASCII before anything else reads it.
#
#   # The same case once the number is derived and checked.
