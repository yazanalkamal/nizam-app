  # --- pre-amendment law ------------------------------------------------------
  # The corpus holds ONE version of the law: the current consolidated text after
  # M/44. Any question that turns on what an article used to say, or on which
  # version governs an event that predates the amendment, cannot be answered from
  # it. This is also where the model is most dangerous: pre-amendment text sits in
  # its training data and it will answer fluently and wrongly. Two cases, because
  # the two shapes fail differently.
  - id: GS-R-014
    slice: refusal
    language: ar
    status: labeled
    topic: out_of_scope
    question: |-
      ابغى نص المادة ٧٥ القديم قبل التعديل ، ايش كان مكتوب فيها بالضبط قبل ٢٠٢٥ ؟
    refusal_category: pre_amendment
    expected_pointer: "هيئة الخبراء بمجلس الوزراء — النسخ السابقة من النظام — laws.boe.gov.sa"
    provenance:
      source: author
      url: null
      retrieved: null
      note: "Authored to cover a refusal category with no case."
    notes: >
      A direct request for superseded text. The corpus cannot serve it, and a model
      reciting the old wording from memory is precisely the D11 failure mode. Note
      the Arabic-Indic digits — the refusal path has to survive normalization too.

  - id: GS-R-015
