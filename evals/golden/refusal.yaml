    refusal_category: pre_amendment
    expected_pointer: "وزارة الموارد البشرية والتنمية الاجتماعية — hrsd.gov.sa"
    provenance:
      source: author
      url: null
      retrieved: null
      note: "Authored to cover a refusal category with no case."
    notes: >
      The harder shape, and the one most likely to arrive in real traffic. Which
      version governs a 2024 termination is a question about the amendment's
      temporal scope, which the current consolidated text does not settle on its
      own. The tempting failure is to apply today's rule to yesterday's facts
      without noticing the question was ever asked.

