# Golden set — refusal slice (target: 20)
#
# Questions the system MUST refuse, each with the category it should name and the
# official source it should redirect to. Measures refusal recall.
#
# A refusal is a helpful redirect that names the topic and points somewhere real
# — never a bare "I can't help with that".
#
# These can be labeled immediately: nothing here asserts what the law says, only
# which topic is out of scope and where to send the person instead.
#
# IMPORTANT COUNTERPART: mentioning GOSI or Qiwa does not make a question out of
# scope. GS-A-002 mentions GOSI but asks what the wage base is (answerable), and
# GS-A-013 mentions Qiwa but asks which notice rule prevails (answerable). Those
# are the false positives this slice must not train the classifier to produce.
#
# Format and status lifecycle: see README.md in this directory.

cases:
  # --- GOSI / social insurance ----------------------------------------------
  - id: GS-R-001
    slice: refusal
    language: ar
    status: labeled
    topic: out_of_scope
    question: |-
      عطوني شعار انهاء العلاقه. عقد على المادة 75 والمادة 84 وتفاجا جاني بتامينات كذا بسبب: (فسخ العقد بموجب المادة (80) من نظام العمل) التأمينات الاجتماعية(GOSI)
    refusal_category: gosi
    expected_pointer: "التأمينات الاجتماعية (GOSI) — gosi.gov.sa"
    provenance:
      source: public_forum
      url: https://manielaw-sa.com/المادة-75-من-نظام-العمل/
      retrieved: 2026-08-19
      note: "comment dated 25 January 2026"
    notes: >
      Blended: the labour-law termination basis (in scope) and the reason recorded
      in the GOSI system (out of scope) conflict. Refuse the GOSI record half by
      name without refusing the article question.

  - id: GS-R-002
    slice: refusal
    language: ar
    status: labeled
    topic: out_of_scope
    question: |-
      سلام عليكم لقد تركت الوظيفة في فترة التجربة ولدي ملاحظتين ابحث عن جواب لهما: ١- وضعت الشركة التي تركتها سبب الاستبعاد في التأمينات الاجتماعيه (استقاله) بدلا من (فسخ عقد خلال فترة التجربة) ، هل هنالك فرق جوهري ممكن يؤثر علي وهل اطالب بتعديل سبب الاستبعاد من الشركة نفسها؟ ٢- تم اعطائي الراتب لشهر يوليو للفترة التي عملت بها ، ولكن لم يتم اعطائي بدل التذاكر للمدة التي عملت بها وهي ٣ شهور، هل انا مستحق لبدل التذاكر ؟
    refusal_category: gosi
    expected_pointer: "التأمينات الاجتماعية (GOSI) — gosi.gov.sa"
    provenance:
      source: public_forum
      url: https://manielaw-sa.com/المادة-53-من-نظام-العمل/
      retrieved: 2026-08-19
      note: "comment dated 26 July 2025"
    notes: "Part 1 is a GOSI coding question; part 2 (ticket allowance) may be in scope. Tests partial refusal."

  - id: GS-R-003
    slice: refusal
    language: ar
    status: labeled
    topic: out_of_scope
    question: |-
      هل الماده ٧٥ في العقد الغير محدد المده تأهل للاستفادة من ساند . وشكرا
    refusal_category: gosi
    expected_pointer: "ساند / التأمينات الاجتماعية (GOSI) — gosi.gov.sa"
    provenance:
      source: public_forum
      url: https://manielaw-sa.com/المادة-75-من-نظام-العمل/
      retrieved: 2026-08-19
      note: "comment dated 6 May 2025"
    notes: "SANED unemployment insurance sits under GOSI, not the Labor Law, despite the Article 75 framing."

  - id: GS-R-004
    slice: refusal
    language: ar
    status: labeled
    topic: out_of_scope
    question: |-
      العقد الغير محدد المده وعملت في الشركة مده 10 شهور متواصلة والان اخبرني صاحب العمل كتابيا ب انه سيتم انهاء عقدي بدون ذكر سبب مشروع هل استحق راتب الاجازه وراتب الشهرين ؟ وهل استحق ساند ؟
    refusal_category: gosi
    expected_pointer: "ساند / التأمينات الاجتماعية (GOSI) — gosi.gov.sa"
    provenance:
      source: public_forum
      url: https://manielaw-sa.com/المادة-75-من-نظام-العمل/
      retrieved: 2026-08-19
      note: "comment dated 14 August 2025"
    notes: >
      The clearest partial case: leave pay and notice pay are in scope, SANED is
      not. Answering both or refusing both are equally wrong.

  # --- immigration / iqama / sponsorship -------------------------------------
  - id: GS-R-005
    slice: refusal
    language: ar
    status: labeled
    topic: out_of_scope
    question: |-
      سلام عليكم ورحمه الله وبركاته هل يجب على العامل نقل كفالته من الشركة إلى شركة خلال فترة التجربة ام يستطيع ترك كفالته على الشركة القديمة لحين انتهاء فترة التجربة مع الشركة الجديدة وبالتالي يستطيع تقل كفالته للشركة الجديدة بعد انتهاء فترة التجربة على الشركة الجديدة وممكن اعرف اي مادة في نظام العمل ينص على هذا الموضوع او يتعلق فيه شكرا جزيلا
    refusal_category: immigration_iqama
    expected_pointer: "وزارة الداخلية / أبشر — absher.sa"
    provenance:
      source: public_forum
      url: https://manielaw-sa.com/المادة-53-من-نظام-العمل/
      retrieved: 2026-08-19
      note: "comment dated 3 February 2025"
    notes: "Explicitly asks which Labor Law article covers sponsorship transfer. The honest answer is none."

