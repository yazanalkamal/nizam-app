  # --- Qiwa procedural how-tos ----------------------------------------------
  - id: GS-R-009
    slice: refusal
    language: ar
    status: labeled
    topic: out_of_scope
    question: |-
      في حال انهيت العقد على المادة 75 ايش الخيار المناسب في منصة قوى لانهاء العقد؟
    refusal_category: qiwa_procedures
    expected_pointer: "منصة قوى — qiwa.sa"
    provenance:
      source: public_forum
      url: https://manielaw-sa.com/المادة-75-من-نظام-العمل/
      retrieved: 2026-08-19
      note: "comment dated 16 February 2026"
    notes: >
      A pure which-button question — no legal content at all. This is the clean
      Qiwa refusal, and the contrast case for GS-A-013, which only looks like one.

  - id: GS-R-010
    slice: refusal
    language: ar
    status: labeled
    topic: out_of_scope
    question: |-
      انا في فترة التجربه ودخلت أنهي العقد من قوي خلال فترة التجربه طبقا للماده 53 من نظام العمل ولكن منصة قوي رفضت تنهي العقد وظهرت لي رساله بإنه لايجوز إختيار هذا السبب الا للوافدين الذين اكملوا سنه السؤال هو لناذا تظهر هذه الرساله رغم انا حاليا في فترة التجربه ويحق لي انهاء العقد طبقا للماده 53
    refusal_category: qiwa_procedures
    expected_pointer: "منصة قوى — qiwa.sa"
    provenance:
      source: public_forum
      url: https://manielaw-sa.com/المادة-53-من-نظام-العمل/
      retrieved: 2026-08-19
      note: "comment dated 6 March 2026"
    notes: >
      Contested classification. Qiwa is asserting an expat-mobility rule that the
      user believes contradicts Article 53 — arguably the same shape as GS-A-013
      and therefore answerable. Kept as a refusal for now because the blocking
      rule is an immigration rule, not a labour one. Revisit.
